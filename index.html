<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PN Composite Limited - Gas Consumption</title>
  <!-- Optional PDF library (jsPDF + AutoTable) for direct PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* Scoped styles for the Gas Consumption module without altering global site theme */
    #gas-consumption-module {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      margin-top: 16px;
    }

    #gas-consumption-module .gc-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    #gas-consumption-module .gc-header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    #gas-consumption-module .gc-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #gas-consumption-module .gc-logo-box {
      width: 48px;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f8fafc;
      font-weight: bold;
      font-size: 12px;
    }

    #gas-consumption-module .gc-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #gas-consumption-module .gc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    #gas-consumption-module .gc-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }

    #gas-consumption-module .gc-field input,
    #gas-consumption-module .gc-field select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
    }

    #gas-consumption-module .gc-field input[readonly] {
      background-color: #f3f4f6;
      font-weight: 600;
    }

    #gas-consumption-module .gc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    #gas-consumption-module .gc-btn {
      padding: 8px 14px;
      border: 1px solid #374151;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: #111827;
      color: #ffffff;
    }

    #gas-consumption-module .gc-btn-secondary {
      background: #ffffff;
      color: #111827;
    }

    #gas-consumption-module .gc-btn-pdf {
      background: #0f766e;
      border-color: #0f766e;
      color: #ffffff;
    }

    #gas-consumption-module .gc-summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
    }

    #gas-consumption-module .gc-table-wrap {
      overflow-x: auto;
    }

    #gas-consumption-module table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    #gas-consumption-module th,
    #gas-consumption-module td {
      border: 1px solid #cbd5e1;
      padding: 7px 8px;
      text-align: center;
      white-space: nowrap;
    }

    #gas-consumption-module th {
      background: #f1f5f9;
      font-weight: 700;
    }

    #gas-consumption-module .gc-hidden {
      display: none !important;
    }

    /* Printable / PDF styling in English */
    @media print {
      body * {
        visibility: hidden;
      }
      #gc-printable-report,
      #gc-printable-report * {
        visibility: visible;
      }
      #gc-printable-report {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!--
    HOW TO ATTACH TO YOUR EXISTING NAVBAR & ADMIN PANEL WITHOUT CHANGING EXISTING DESIGN:
    1. In your existing Navigation Bar, add:
       <button type="button" class="nav-gas-btn" onclick="openGasConsumptionPage()">Gas consumption</button>
    2. In your existing Admin Panel menu/sidebar, add:
       <button type="button" class="admin-gas-btn" onclick="openGasConsumptionPage()">Gas consumption</button>
    3. Make sure your existing company logo element (e.g. <img id="existing-company-logo" src="...">)
       keeps its ID or source so the script automatically reuses it.
  -->

  <div class="no-print" style="padding: 10px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; flex-wrap: wrap;">
    <!-- Example Menu Bar Button -->
    <button type="button" class="nav-gas-btn" onclick="openGasConsumptionPage()">Gas consumption</button>
    <!-- Example Admin Panel Button -->
    <button type="button" class="admin-gas-btn" onclick="openGasConsumptionPage()">Admin: Gas consumption</button>
  </div>

  <!-- Gas Consumption Page / View -->
  <section id="gas-consumption-module" class="gc-hidden" aria-label="Gas Consumption">
    <div id="gc-printable-report" class="gc-card">
      <div class="gc-header-row">
        <div class="gc-title-group">
          <div class="gc-logo-box" id="gc-logo-container">
            <span id="gc-logo-fallback">LOGO</span>
          </div>
          <div>
            <h2 id="gc-company-name" style="margin: 0; font-size: 18px; text-transform: uppercase;">
              PN COMPOSITE LIMITED
            </h2>
            <div id="gc-company-address" style="font-size: 12px; color: #4b5563;">
              AMBAG, KONABARI, GAZIPUR
            </div>
            <div style="font-size: 13px; font-weight: 700; margin-top: 2px;">
              GAS CONSUMPTION LOG SHEET
            </div>
          </div>
        </div>

        <div class="no-print" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <label style="font-size: 12px; font-weight: 600;">
            Select Report Date:
            <input type="date" id="gc-report-date" onchange="handleReportDateChange()" style="padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px;" />
          </label>
          <button type="button" class="gc-btn gc-btn-pdf" onclick="downloadGasReportPDF()">Download PDF</button>
          <button type="button" class="gc-btn gc-btn-secondary" onclick="closeGasConsumptionPage()">Close</button>
        </div>
      </div>

      <!-- Entry Form -->
      <form id="gc-entry-form" class="no-print" onsubmit="saveGasEntry(event)">
        <div class="gc-grid">
          <div class="gc-field">
            <label for="gc-date">Date</label>
            <input type="date" id="gc-date" required onchange="syncPreviousReadingFromDate()" />
          </div>

          <div class="gc-field">
            <label for="gc-time">Time (Default 09:00 AM)</label>
            <input type="time" id="gc-time" value="09:00" required />
          </div>

          <div class="gc-field">
            <label for="gc-prev-reading">Previous Meter Reading (M³)</label>
            <input type="number" step="0.01" id="gc-prev-reading" required oninput="calculateDailyAndMonthly()" />
          </div>

          <div class="gc-field">
            <label for="gc-present-reading">Present Meter Reading (M³)</label>
            <input type="number" step="0.01" id="gc-present-reading" required oninput="calculateDailyAndMonthly()" />
          </div>

          <div class="gc-field">
            <label for="gc-daily-consumption">Daily Consumption (M³)</label>
            <input type="number" step="0.01" id="gc-daily-consumption" readonly />
          </div>

          <div class="gc-field">
            <label for="gc-monthly-consumption">Monthly Consumption (M³)</label>
            <input type="number" step="0.01" id="gc-monthly-consumption" readonly />
          </div>

          <div class="gc-field" style="grid-column: span 2;">
            <label for="gc-remarks">Remarks</label>
            <input type="text" id="gc-remarks" placeholder="Enter remarks (in English)" />
          </div>
        </div>

        <div class="gc-actions">
          <button type="submit" class="gc-btn">Save Entry</button>
          <button type="button" class="gc-btn gc-btn-secondary" onclick="clearEntryForm()">Clear</button>
        </div>
      </form>

      <!-- Monthly Summary & Production/Cost Inputs -->
      <div class="gc-summary-bar">
        <div class="gc-field">
          <label for="gc-total-gas">Total Gas Consumption (M³)</label>
          <input type="number" step="0.01" id="gc-total-gas" readonly />
        </div>

        <div class="gc-field">
          <label for="gc-total-production-mwh">Total Production (MWH)</label>
          <input type="number" step="0.01" id="gc-total-production-mwh" placeholder="Enter monthly MWH" oninput="calculateCostPerKwh()" />
        </div>

        <div class="gc-field">
          <label for="gc-cost-kwh">Cost / kWh</label>
          <input type="number" step="0.0001" id="gc-cost-kwh" placeholder="Auto or manual value" oninput="saveMonthlySummaryMeta()" />
        </div>

        <div class="gc-field">
          <label for="gc-month-label">Selected Month &amp; Year</label>
          <input type="text" id="gc-month-label" readonly />
        </div>
      </div>

      <!-- Log Table -->
      <div class="gc-table-wrap">
        <table id="gc-log-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Previous Meter Reading (M³)</th>
              <th>Present Meter Reading (M³)</th>
              <th>Daily Consumption (M³)</th>
              <th>Monthly Consumption (M³)</th>
              <th>Remarks</th>
              <th class="no-print">Action</th>
            </tr>
          </thead>
          <tbody id="gc-log-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    const GC_STORAGE_KEY = "pn_composite_gas_consumption_v1";
    const GC_META_KEY = "pn_composite_gas_meta_v1";

    function openGasConsumptionPage() {
      const moduleEl = document.getElementById("gas-consumption-module");
      moduleEl.classList.remove("gc-hidden");
      syncExistingCompanyBranding();
      initializeDefaultDates();
      renderGasTable();
    }

    function closeGasConsumptionPage() {
      document.getElementById("gas-consumption-module").classList.add("gc-hidden");
    }

    // Reuses existing logo & company name if present on the host page
    function syncExistingCompanyBranding() {
      const existingLogoImg =
        document.querySelector('img[alt*="logo" i]') ||
        document.querySelector(".navbar-brand img") ||
        document.querySelector(".logo img");

      const logoContainer = document.getElementById("gc-logo-container");
      if (existingLogoImg && existingLogoImg.src) {
        logoContainer.innerHTML = `<img src="${existingLogoImg.src}" alt="Company Logo" />`;
      }
    }

    function initializeDefaultDates() {
      const dateInput = document.getElementById("gc-date");
      const timeInput = document.getElementById("gc-time");
      const reportDateInput = document.getElementById("gc-report-date");

      const todayStr = new Date().toISOString().split("T")[0];
      if (!dateInput.value) dateInput.value = todayStr;
      if (!timeInput.value) timeInput.value = "09:00";
      if (!reportDateInput.value) reportDateInput.value = dateInput.value;

      updateMonthLabel(reportDateInput.value);
      syncPreviousReadingFromDate();
      loadMonthlySummaryMeta();
    }

    function handleReportDateChange() {
      const reportDate = document.getElementById("gc-report-date").value;
      if (reportDate) {
        document.getElementById("gc-date").value = reportDate;
        updateMonthLabel(reportDate);
        loadMonthlySummaryMeta();
        renderGasTable();
        syncPreviousReadingFromDate();
      }
    }

    function updateMonthLabel(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      if (isNaN(d.getTime())) return;
      const monthName = d.toLocaleString("en-US", { month: "long" }).toUpperCase();
      const yearNum = d.getFullYear();
      document.getElementById("gc-month-label").value = `${monthName} ${yearNum}`;
    }

    function getAllEntries() {
      try {
        return JSON.parse(localStorage.getItem(GC_STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveAllEntries(entries) {
      localStorage.setItem(GC_STORAGE_KEY, JSON.stringify(entries));
    }

    // Automatically pulls previous day's present meter reading as Previous Meter Reading
    function syncPreviousReadingFromDate() {
      const selectedDate = document.getElementById("gc-date").value;
      if (!selectedDate) return;

      const entries = getAllEntries()
        .filter((item) => item.date < selectedDate)
        .sort((a, b) => b.date.localeCompare(a.date));

      const prevInput = document.getElementById("gc-prev-reading");
      if (entries.length > 0 && entries[0].presentReading !== "") {
        prevInput.value = entries[0].presentReading;
      }
      calculateDailyAndMonthly();
    }

    function formatTime12h(time24) {
      if (!time24) return "09:00 AM";
      const [hh, mm] = time24.split(":").map(Number);
      const period = hh >= 12 ? "PM" : "AM";
      const hour12 = hh % 12 === 0 ? 12 : hh % 12;
      return `${String(hour12).padStart(2, "0")}:${String(mm).padStart(2, "0")} ${period}`;
    }

    function calculateDailyAndMonthly() {
      const prev = parseFloat(document.getElementById("gc-prev-reading").value);
      const present = parseFloat(document.getElementById("gc-present-reading").value);
      const selectedDate = document.getElementById("gc-date").value || new Date().toISOString().split("T")[0];
      const monthKey = selectedDate.slice(0, 7);

      const daily = !isNaN(prev) && !isNaN(present) ? Number((present - prev).toFixed(2)) : 0;
      document.getElementById("gc-daily-consumption").value = !isNaN(prev) && !isNaN(present) ? daily : "";

      const monthEntries = getAllEntries().filter(
        (item) => item.date.startsWith(monthKey) && item.date !== selectedDate
      );
      const priorMonthTotal = monthEntries.reduce((sum, item) => sum + (Number(item.dailyConsumption) || 0), 0);
      const monthlyTotal = Number((priorMonthTotal + (!isNaN(prev) && !isNaN(present) ? daily : 0)).toFixed(2));

      document.getElementById("gc-monthly-consumption").value = monthlyTotal;
      document.getElementById("gc-total-gas").value = monthlyTotal;
      calculateCostPerKwh();
    }

    function saveGasEntry(event) {
      event.preventDefault();
      const date = document.getElementById("gc-date").value;
      const time24 = document.getElementById("gc-time").value || "09:00";
      const timeFormatted = formatTime12h(time24);
      const prevReading = parseFloat(document.getElementById("gc-prev-reading").value);
      const presentReading = parseFloat(document.getElementById("gc-present-reading").value);
      const remarks = document.getElementById("gc-remarks").value.trim();

      if (isNaN(prevReading) || isNaN(presentReading)) return;

      const dailyConsumption = Number((presentReading - prevReading).toFixed(2));
      let entries = getAllEntries().filter((item) => item.date !== date);

      entries.push({
        date,
        time24,
        timeFormatted,
        prevReading,
        presentReading,
        dailyConsumption,
        remarks
      });

      entries.sort((a, b) => a.date.localeCompare(b.date));
      saveAllEntries(entries);
      saveMonthlySummaryMeta();
      renderGasTable();
    }

    function deleteGasEntry(date) {
      const updated = getAllEntries().filter((item) => item.date !== date);
      saveAllEntries(updated);
      renderGasTable();
    }

    function clearEntryForm() {
      document.getElementById("gc-present-reading").value = "";
      document.getElementById("gc-daily-consumption").value = "";
      document.getElementById("gc-remarks").value = "";
      document.getElementById("gc-time").value = "09:00";
    }

    function getMonthKey() {
      const d = document.getElementById("gc-report-date").value || document.getElementById("gc-date").value;
      return (d || new Date().toISOString().split("T")[0]).slice(0, 7);
    }

    function saveMonthlySummaryMeta() {
      const monthKey = getMonthKey();
      const allMeta = JSON.parse(localStorage.getItem(GC_META_KEY) || "{}");
      allMeta[monthKey] = {
        totalProductionMwh: document.getElementById("gc-total-production-mwh").value,
        costKwh: document.getElementById("gc-cost-kwh").value
      };
      localStorage.setItem(GC_META_KEY, JSON.stringify(allMeta));
    }

    function loadMonthlySummaryMeta() {
      const monthKey = getMonthKey();
      const allMeta = JSON.parse(localStorage.getItem(GC_META_KEY) || "{}");
      const meta = allMeta[monthKey] || {};
      document.getElementById("gc-total-production-mwh").value = meta.totalProductionMwh || "";
      document.getElementById("gc-cost-kwh").value = meta.costKwh || "";
    }

    function calculateCostPerKwh() {
      saveMonthlySummaryMeta();
    }

    function renderGasTable() {
      const tbody = document.getElementById("gc-log-tbody");
      const monthKey = getMonthKey();
      const entries = getAllEntries()
        .filter((item) => item.date.startsWith(monthKey))
        .sort((a, b) => a.date.localeCompare(b.date));

      let runningMonthly = 0;
      tbody.innerHTML = "";

      entries.forEach((row) => {
        const dailyVal = Number(row.dailyConsumption) || 0;
        runningMonthly = Number((runningMonthly + dailyVal).toFixed(2));

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.date}</td>
          <td>${row.timeFormatted || "09:00 AM"}</td>
          <td>${Number(row.prevReading).toFixed(2)}</td>
          <td>${Number(row.presentReading).toFixed(2)}</td>
          <td>${dailyVal.toFixed(2)}</td>
          <td>${runningMonthly.toFixed(2)}</td>
          <td>${row.remarks || ""}</td>
          <td class="no-print">
            <button type="button" onclick="deleteGasEntry('${row.date}')" style="padding:3px 8px; cursor:pointer;">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("gc-monthly-consumption").value = runningMonthly.toFixed(2);
      document.getElementById("gc-total-gas").value = runningMonthly.toFixed(2);
    }

    // Downloads English PDF report with company name, logo, table, and totals
    function downloadGasReportPDF() {
      const selectedDate = document.getElementById("gc-report-date").value || document.getElementById("gc-date").value;
      const monthKey = (selectedDate || new Date().toISOString().split("T")[0]).slice(0, 7);
      const monthLabel = document.getElementById("gc-month-label").value || monthKey;
      const companyName = document.getElementById("gc-company-name").textContent.trim();
      const companyAddress = document.getElementById("gc-company-address").textContent.trim();
      const totalGas = document.getElementById("gc-total-gas").value || "0.00";
      const totalProdMwh = document.getElementById("gc-total-production-mwh").value || "0.00";
      const costKwh = document.getElementById("gc-cost-kwh").value || "0.00";

      const entries = getAllEntries()
        .filter((item) => item.date.startsWith(monthKey))
        .sort((a, b) => a.date.localeCompare(b.date));

      let runningMonthly = 0;
      const tableBody = entries.map((r) => {
        const dailyVal = Number(r.dailyConsumption) || 0;
        runningMonthly = Number((runningMonthly + dailyVal).toFixed(2));
        return [
          r.date,
          r.timeFormatted || "09:00 AM",
          Number(r.prevReading).toFixed(2),
          Number(r.presentReading).toFixed(2),
          dailyVal.toFixed(2),
          runningMonthly.toFixed(2),
          r.remarks || ""
        ];
      });

      if (window.jspdf && window.jspdf.jsPDF) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });

        const logoImg = document.querySelector("#gc-logo-container img");
        if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
          try {
            doc.addImage(logoImg, "PNG", 40, 30, 38, 38);
          } catch (e) {}
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text(companyName, 90, 45);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(companyAddress, 90, 58);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text(`GAS CONSUMPTION LOG SHEET (${monthLabel})`, 90, 72);

        doc.setFontSize(9);
        doc.text(`Report Date: ${selectedDate}`, 400, 45);

        doc.autoTable({
          startY: 85,
          head: [[
            "Date",
            "Time",
            "Previous Meter Reading (M3)",
            "Present Meter Reading (M3)",
            "Daily Consumption (M3)",
            "Monthly Consumption (M3)",
            "Remarks"
          ]],
          body: tableBody,
          styles: { fontSize: 8, cellPadding: 4 },
          headStyles: { fillColor: [30, 41, 59] }
        });

        const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 16 : 120;
        doc.autoTable({
          startY: finalY,
          body: [
            ["Total Gas Consumption (M3)", totalGas],
            ["Total Production (MWH)", totalProdMwh],
            ["Cost / kWh", costKwh]
          ],
          styles: { fontSize: 9, cellPadding: 4 },
          columnStyles: { 0: { fontStyle: "bold", cellWidth: 180 }, 1: { cellWidth: 100 } }
        });

        doc.save(`Gas_Consumption_${monthKey}.pdf`);
      } else {
        window.print();
      }
    }
  </script>
</body>
</html>
